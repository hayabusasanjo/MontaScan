name: Build MontaScan Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Initialize Android Host Wrapper
        working-directory: ./mobile
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          if [ ! -d "android" ]; then
            echo "Generating Android scaffolding..."
            flutter create --org ph.edu.cdm.montascan --project-name montascan --platforms android .
          fi
          mv pubspec.yaml.bak pubspec.yaml

      - name: Patch Android SDK & Gradle Settings
        working-directory: ./mobile
        run: |
          # 1. Accept Android Licenses
          yes | flutter doctor --android-licenses || true

          # 2. Configure minSdkVersion 21 & compileSdkVersion 34 in android/app/build.gradle
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' "$APP_GRADLE"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' "$APP_GRADLE"
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' "$APP_GRADLE"
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' "$APP_GRADLE"
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' "$APP_GRADLE"
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' "$APP_GRADLE"
          fi

          # 3. Add Camera and Network permissions to AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-feature android:name="android.hardware.camera" android:required="false" \/>' "$MANIFEST"
          fi

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=SUPABASE_URL=https://rjaidazqazhfovxwaeba.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_Zk9OK4Fh41cMhq1TNBQ0TQ_io7UmqHq

      - name: Locate and Stage APK for Download
        run: |
          echo "Scanning workspace for compiled APKs:"
          find . -name "*.apk"
          APK_PATH=$(find . -name "*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" ./montascan-release.apk
          ls -lh ./montascan-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MontaScan-Release-APK
          path: montascan-release.apk
          if-no-files-found: error
          retention-days: 14
