workflows:
  android-release:
    name: MontaScan Android APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter dependencies
        working_directory: mobile
        script: |
          flutter pub get
      - name: Build Android Release APK
        working_directory: mobile
        script: |
          flutter build apk --release
    artifacts:
      - mobile/build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - hayabusasanjoninja@gmail.com
        notify:
          success: true
          failure: true
